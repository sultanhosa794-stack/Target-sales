name: Validate Target Sales

on:
  push:
    branches: [main, 'fix/target-sales-1.4.1', fix/profiles-1101-20261016, 'feature/v1.3.9-b25-stability-performance', 'release/1.4.0-region-account-fixes']
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: TypeScript check
        run: npm run typecheck
      - name: Validate Expo config
        run: npx expo config --type public > /dev/null
