name: Validate rebuild

on:
  push:
    branches: [rebuild-v2]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript
        run: npm run typecheck
      - name: Expo config
        env:
          EXPO_PUBLIC_SUPABASE_URL: https://feeaekqyqtttpuajmcob.supabase.co
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable__FeQluvb6h7pD0CejDlanQ__ZrAqQUl
        run: npx expo config --type public > /dev/null
