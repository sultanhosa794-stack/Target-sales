name: iPhone web build

on:
  pull_request:
    branches: [main]
  push:
    branches: [codex/ios-pwa-support]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx expo export --platform web
